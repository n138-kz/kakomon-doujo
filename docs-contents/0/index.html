<!DOCTYPE html><html lang="ja" dir="ltr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<base target="_blank">
	<title>n138-kz.github.io</title>
	<link rel="stylesheet" type="text/css" href="../@lib/master.css" />
	<style>
		.container {
			display: flex;
			width: 100vw;
			align-items: stretch;
		}
		.container>div, #InstallationTechnicianDigitalClass1 {
			background-color: white;
			box-sizing: border-box;
			width: 98vw;
			margin: 0 auto;
		}
	</style>
	<script src="../@lib/define.js"></script>
	<script>
		window.addEventListener('DOMContentLoaded', async ()=>{
			Array.from(document.querySelectorAll('meta[http-equiv="refresh"]')).map((e)=>{
				e.content = `${e.content.split(';')[0]};${location.href.split('?')[0]}`;
			});
		});
		window.addEventListener('DOMContentLoaded', async ()=>{
			Array.from(document.querySelectorAll('img[src^="https://api.qrserver.com/v1/create-qr-code/"]')).map((e)=>{
				e.src = e.src.split('?')[0];
				e.src += `?data=${location.href.split('?')[0]}`;
				e.alt = `QR code: ${location.href.split('?')[0]}`;
				e.title = `QR code: ${location.href.split('?')[0]}`;
			});
		});
		window.addEventListener('DOMContentLoaded', async ()=>{
			let catalog = [];
			let userPermmision = [];
			{
				let url = './index/';
				let options = {};
				let req = await fetch(url, {
					method: 'GET',
					headers: {
						'Accept': 'application/json',
						'Content-Type': 'application/json',
					},
				});
				console.log(req.status, req.statusText);
				if (false) {
				} else if (req.status === 401) {
					location.replace('../auth/');
					return;
				} else if (req.status === 403) {
					location.replace('../profiles/');
					return;
				} else {
					let res = await req.text();
					if (res.length===0) {
						console.warn(req.status, req.statusText, res);
						return;
					}
					let bin = JSON.parse(res);
					console.debug(bin);
					catalog = bin['data'];
					userPermmision = bin['user'];
				}
			}

			document.querySelector('div.container').textContent = '';
			const d=[];
			for (let i=0;i<catalog.length;i++) {
				d.push(document.createElement('div')); {
					d[d.length-1].id = catalog[i]['id']??'';
					d.push(document.createElement('h2')); {
						d[d.length-1].textContent = catalog[i]['name']??'';
					}
					d[d.length-2].appendChild(d[d.length-1]); d.pop();

					if (catalog[i]['id']!==null) {
						d.push(document.createElement('table')); {
							d.push(document.createElement('tbody')); {
								d.push(document.createElement('tr')); {
									d.push(document.createElement('th')); {
										d[d.length-1].textContent = 'カテゴリー';
									}
									d[d.length-2].appendChild(d[d.length-1]); d.pop();
									d.push(document.createElement('td')); {
										for (let j=0;j<catalog[i]['content']['category'].length;j++) {
											d.push(document.createElement('label')); {
												d.push(document.createElement('input')); {
													d[d.length-1].type = 'radio';
													d[d.length-1].name = '_';
													d[d.length-1].value = catalog[i]['content']['category'][j]['id'];
													if (catalog[i]['content']['category'][j]['id'] === catalog[i]['content']['category_selected']) {
														d[d.length-1].checked = true;
													}
												}
												d[d.length-2].appendChild(d[d.length-1]); d.pop();

												d.push(document.createTextNode(catalog[i]['content']['category'][j]['name'])); {}
												d[d.length-2].appendChild(d[d.length-1]); d.pop();
											}
											d[d.length-2].appendChild(d[d.length-1]); d.pop();

											d.push(document.createElement('br')); {}
											d[d.length-2].appendChild(d[d.length-1]); d.pop();
										}
									}
									d[d.length-2].appendChild(d[d.length-1]); d.pop();
								}
								d[d.length-2].appendChild(d[d.length-1]); d.pop();
								d.push(document.createElement('tr')); {
									d.push(document.createElement('th')); {
										d[d.length-1].textContent = '問題数';
									}
									d[d.length-2].appendChild(d[d.length-1]); d.pop();

									d.push(document.createElement('td')); {
										d.push(document.createElement('input')); {
											d[d.length-1].type = 'number';
											d[d.length-1].value = 5;
											d[d.length-1].min = '1';
											d[d.length-1].addEventListener('keydown', (e)=>{
												if (e.key.toLowerCase()=='enter') {
													e.target.parentElement.parentElement.parentElement.querySelector('input[type="button"][data-name="start"]').click();
												}
											});
										}
										d[d.length-2].appendChild(d[d.length-1]); d.pop();
									}
									d[d.length-2].appendChild(d[d.length-1]); d.pop();
								}
								d[d.length-2].appendChild(d[d.length-1]); d.pop();

								d.push(document.createElement('tr')); {
									d.push(document.createElement('th')); {}
									d[d.length-2].appendChild(d[d.length-1]); d.pop();

									d.push(document.createElement('td')); {
										d.push(document.createElement('input')); {
											d[d.length-1].type = 'button';
											d[d.length-1].value = '演習開始';
											d[d.length-1].dataset.href = `./${catalog[i]['id']}/?limit`;
											d[d.length-1].dataset.name = 'start';
											d[d.length-1].style.marginRight = '5px';
											d[d.length-1].addEventListener('click', (e)=>{
												location.replace(`${e.target.dataset.href.split('?')[0]}?limit=${e.target.parentElement.parentElement.parentElement.querySelector('input[type="number"]').value}`);
											});
										}
										d[d.length-2].appendChild(d[d.length-1]); d.pop();

										d.push(document.createElement('input')); {
											d[d.length-1].type = 'button';
											d[d.length-1].value = '問題管理';
											d[d.length-1].dataset.href = `./${catalog[i]['id']}/0/`;
											d[d.length-1].dataset.name = 'manage';
											d[d.length-1].style.marginLeft = '5px';
											d[d.length-1].addEventListener('click', (e)=>{
												location.replace(`${e.target.dataset.href.split('?')[0]}?limit=${e.target.parentElement.parentElement.parentElement.querySelector('input[type="number"]').value}`);
											});
										}
										d[d.length-2].appendChild(d[d.length-1]); d.pop();
									}
									d[d.length-2].appendChild(d[d.length-1]); d.pop();
								}
								d[d.length-2].appendChild(d[d.length-1]); d.pop();
							}
							d[d.length-2].appendChild(d[d.length-1]); d.pop();
						}
						d[d.length-2].appendChild(d[d.length-1]); d.pop();
					}
				}
				document.querySelector('div.container').appendChild(d[d.length-1]); d.pop();
			}
		});
		window.addEventListener('DOMContentLoaded', async ()=>{
			// 履歴に現在の状態を追加する
			history.pushState(null, null, window.location.href);

			// 「戻る」ボタンが押されたときのイベントを検知する
			window.addEventListener('popstate', () => {
				// 強制的に指定のURLへリダイレクト（履歴を上書き）
				location.replace('./');
			});
		});
	</script>
</head>
<body>
	<h1><a href="https://n138-kz.github.io">n138.jp</a></h1>
	<div class="container"></div>
	<p><a href="../auth/" target="_self">サインイン / サインアップ</a></p>
</body>
</html>
