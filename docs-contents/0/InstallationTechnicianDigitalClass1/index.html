<!DOCTYPE html><html lang="ja" dir="ltr">

	<link rel="stylesheet" type="text/css" href="../../@lib/master.css" />
	<style>
		html {
			overflow-x: hidden;
		}
		.container {
			display: flex;
			width: 100vw;
			align-items: stretch;
		}
		#mondai {
			background-color: white;
			box-sizing: border-box;
			width: calc(100vw - 75px - 15px);
		}
		#kaitou {
			width: 75px;
			background-color: white;
			user-select: none;
			padding-top: 1em;
		}
		#kaitou input[type="button"] {
			max-width: 100px;
			width: 100%;
		}
		@media screen and (max-width: 400px) {
			.container {
				flex-direction: column;
			}
			#mondai {
				width: 100%;
			}
			#kaitou {
				width: 100%;
			}
		}
		.is-clicked:not(.label.mondai_kaitou_answered) {
			background-color: #ffa500;
			animation: fadeBack 3s forwards;
		}
		@keyframes fadeBack {
			0% {}
			100% {
				background-color: transparent;
			}
		}
		label.mondai_kaitou_correct {
			background-color: limegreen;
		}
		label.mondai_kaitou_incorrect {
			background-color: coral;
		}
	</style>
	<script>

				e.content = `${e.content.split(';')[0]};${location.href.split('?')[0]}`;
			});

		function get_GETarray() {
			let q=(decodeURI(location.search)+'&').replace(/^\?/,'').split('&');
			let queries=[];
			for (let i=0; i<q.length; i++) {
				if(q[i].length>0){
					if(q[i].indexOf('=')>0){
						query=q[i].split('=');
						queries[query[0]]=query[1];
					} else {
						queries[q[i]]=null;
					}
				}
			}
			return queries;
